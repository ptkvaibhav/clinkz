name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The fail-closed leak layer. Every other guard is local and therefore
  # skippable: `core.hooksPath` is per-clone config a fresh clone does not have
  # until `python scripts/bootstrap.py` runs, and `--no-verify` skips the git
  # hook outright. This job runs server-side on the resulting tree, so no local
  # config, no flag, and no un-bootstrapped clone can get past it. It shares no
  # setup with lint-and-test (no package install, no system deps) so it stays
  # fast and reports independently.
  leak-guard:
    name: Leak guard (outputs/ · .env · credentials)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refuse run artifacts under outputs/
        run: python3 .claude/hooks/outputs_guard.py --tree HEAD

      - name: Refuse credential material and .env files
        run: python3 .claude/hooks/secret_guard.py --tree HEAD

  # The context-budget layer. CLAUDE.md reached 152,205 characters against a
  # ~150k load limit, a bound that degrades by truncating SILENTLY — so the
  # first symptom is rules quietly not in effect. This job is the fail-closed
  # half of that guard: the local hook is skippable (`--no-verify`, an
  # un-bootstrapped clone), this is not. Like leak-guard it shares no setup with
  # lint-and-test (no install, pure stdlib) so it stays fast, reports
  # independently, and runs on doc-only PRs — which are exactly the PRs that
  # grow an instruction file.
  context-budget:
    name: Context budget (always-loaded instruction files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instruction files stay under their character budget
        run: python3 .claude/hooks/context_budget.py

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev libgdk-pixbuf-2.0-0

      # `-c` constrains every package — direct and transitive — to the locked
      # version. Pinning typer/click/rich in pyproject.toml closed one instance
      # of a class: the resolver was still free to pick a different build of the
      # other ~80 packages here than on a developer machine. The lock makes the
      # install reproducible; the step below asserts it actually was.
      - name: Install dependencies (constrained by the lockfile)
        run: pip install -c requirements-ci.lock -e ".[dev]"

      - name: Assert the resolved dependency set matches the lockfile
        run: python scripts/lockfile.py --check

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      # Keyless runner: no provider API keys, no live containers. The selection
      # below mirrors CLAUDE.md gate-2 and excludes every suite that needs a
      # real API key or a running target (DVWA :8080, Juice Shop :3000). Those
      # suites skip via fixture guards anyway, but excluding them keeps the CI
      # selection explicitly container-free and key-free.
      - name: Run tests
        run: >-
          pytest tests/ -q --tb=short
          --ignore=tests/test_integration
          --ignore=tests/test_skills_dvwa
          --ignore=tests/test_skills_juiceshop
          --ignore=tests/test_pipeline_smoke
