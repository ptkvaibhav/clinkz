<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Clinkz — Autonomous AI-Driven Penetration Testing Framework">
  <title>Clinkz — Autonomous AI-Driven Penetration Testing Framework</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070b16"/>
      <stop offset="55%"  stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%"   stop-color="#e2e8f0"/>
      <stop offset="60%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.45"/>
    </pattern>

    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- thin top + bottom accent rules -->
  <rect x="0" y="0"   width="1200" height="2"   fill="url(#accent)" opacity="0.55"/>
  <rect x="0" y="298" width="1200" height="2"   fill="url(#accent)" opacity="0.35"/>

  <!-- agent-graph motif (orchestrator + 4 phase agents) -->
  <g transform="translate(870 150)" stroke="#22d3ee" stroke-width="1.2" fill="none" opacity="0.85">
    <line x1="0"   y1="0" x2="-110" y2="-70"/>
    <line x1="0"   y1="0" x2="110"  y2="-70"/>
    <line x1="0"   y1="0" x2="-110" y2="70"/>
    <line x1="0"   y1="0" x2="110"  y2="70"/>
    <line x1="0"   y1="0" x2="170"  y2="0"/>
  </g>
  <g transform="translate(870 150)" filter="url(#softGlow)">
    <!-- orchestrator (center) -->
    <circle cx="0" cy="0" r="11" fill="#0a1124" stroke="#a78bfa" stroke-width="2"/>
    <!-- phase agents -->
    <circle cx="-110" cy="-70" r="7" fill="#0a1124" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="110"  cy="-70" r="7" fill="#0a1124" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="-110" cy="70"  r="7" fill="#0a1124" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="110"  cy="70"  r="7" fill="#0a1124" stroke="#22d3ee" stroke-width="1.6"/>
    <!-- report sink -->
    <circle cx="170" cy="0" r="7" fill="#0a1124" stroke="#7c3aed" stroke-width="1.6"/>
  </g>
  <g transform="translate(870 150)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="10" fill="#64748b" opacity="0.85">
    <text x="-150" y="-78" text-anchor="end">recon</text>
    <text x="150"  y="-78">scan</text>
    <text x="-150" y="80"  text-anchor="end">research</text>
    <text x="150"  y="80">exploit</text>
    <text x="195"  y="-3">report</text>
    <text x="0"    y="32"  text-anchor="middle" fill="#a78bfa">orchestrator</text>
  </g>

  <!-- wordmark -->
  <text x="80" y="160"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="108"
        font-weight="800"
        letter-spacing="-3"
        fill="url(#wordmark)">clinkz</text>

  <!-- tagline -->
  <text x="84" y="200"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18"
        font-weight="500"
        letter-spacing="2"
        fill="#22d3ee">AUTONOMOUS&#160;&#160;AI-DRIVEN&#160;&#160;PENETRATION&#160;&#160;TESTING</text>

  <!-- subline -->
  <text x="84" y="232"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="16"
        fill="#94a3b8">Multi-agent · LLM-mediated orchestrator · deterministic skills · cross-engagement learning</text>
</svg>
