[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinkz"
version = "0.1.0"
description = "Autonomous AI penetration testing system powered by multi-agent collaboration"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pratik Vaibhav", email = "ptkvaibhav@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.34.0",
    "google-genai>=0.5.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "aiohttp>=3.13.4",
    "aiosqlite>=0.20.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    # Upper-bounded deliberately: mcp 2.0.0 moved the server-side FastMCP out of
    # the package, so `mcp.server.fastmcp` (which tests/fixtures/mcp_server_script.py
    # imports) does not exist there. An unpinned `>=1.0.0` let CI resolve 2.0.0
    # while developer machines kept 1.x — the whole MCP transport suite failed on
    # the runner only. Raise the bound once the client code is verified against 2.x.
    "mcp[cli]>=1.0.0,<2",
    "defusedxml>=0.7.1",
    "PyJWT>=2.13.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/ptkvaibhav/clinkz"
Repository = "https://github.com/ptkvaibhav/clinkz"
Issues = "https://github.com/ptkvaibhav/clinkz/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]
# The P7 client-side execution oracle. Kept OPTIONAL on purpose: without it the
# engine behaves exactly as it did before — a DOM/CSP candidate stays an
# UnprovenExploitLead instead of silently degrading to an inferred finding. An
# absent browser must cost coverage, never honesty.
browser = [
    "playwright>=1.49.0",
]

[project.scripts]
clinkz = "clinkz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clinkz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live integration tests requiring external services (DVWA, network tools)",
    "dvwa_smoke: live DVWA skill smoke tests (require running DVWA at localhost:8080)",
    "juiceshop_smoke: live Juice Shop skill smoke tests (require running Juice Shop at localhost:3000)",
    "pipeline_smoke: real-container full-pipeline smoke tests — blocking on CI when the underlying target is up",
    "p7_browser: P7 client-side execution oracle tests requiring a real headless browser (pip install -e '.[browser]' && playwright install chromium)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["clinkz"]
