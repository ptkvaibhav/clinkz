[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinkz"
version = "0.1.0"
description = "Autonomous AI penetration testing system powered by multi-agent collaboration"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pratik Vaibhav", email = "ptkvaibhav@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.34.0",
    "google-genai>=0.5.0",
    "pydantic>=2.7.0",
    # Pinned exactly, and click/rich with it. `typer>=0.12.0` let CI resolve a
    # different CLI stack from every developer machine, in a repo whose premise
    # is reproducible verification — the same shape as the `mcp` bound below.
    # These three are not incidental: the exit-code contract and the documented
    # flag list are asserted against what they RENDER, so a minor bump in any of
    # them can turn an interface test red without a line of clinkz changing.
    # click and rich arrive transitively via typer, but a test that reads their
    # output is a direct dependency on them, so they are declared as one.
    # These are the versions the last green CI run resolved; bump deliberately.
    "typer==0.27.1",
    "click==8.4.2",
    "rich==15.0.0",
    "aiohttp>=3.13.4",
    "aiosqlite>=0.20.0",
    # Both of these are declared for a report renderer that does not exist. They
    # are left in place deliberately: removing a dependency is a separate
    # decision from noticing it is unused, and the audit that found them
    # (docs/analysis/dependencies.md, Actionable findings) covers the whole set
    # at once.
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    # Read by the DISCLOSURE GATE, not by any renderer, and the only dependency
    # here whose consumer is in this repository today
    # (engagement/artifact_scan.py). A PDF's page text lives in Flate-compressed
    # content streams and its metadata in a separate /Info dictionary, so a byte
    # scan of the file sees NEITHER. Without a real extractor, letting .pdf into
    # the scanned set would have created a region the gate reports CLEAN over by
    # construction — which is the defect the gate exists to prevent, reintroduced
    # by the fix for it.
    #
    # Floored at 6.9.1, not the 5.x that would satisfy the import: 6.8.0 carries
    # the 7 advisories tabulated in docs/analysis/dependencies.md §2, and adding a
    # known-vulnerable package in the same change that reports pillow's five is
    # not a position worth defending.
    "pypdf>=6.9.1",
    "python-dotenv>=1.0.0",
    # Upper-bounded deliberately: mcp 2.0.0 moved the server-side FastMCP out of
    # the package, so `mcp.server.fastmcp` (which tests/fixtures/mcp_server_script.py
    # imports) does not exist there. An unpinned `>=1.0.0` let CI resolve 2.0.0
    # while developer machines kept 1.x — the whole MCP transport suite failed on
    # the runner only. Raise the bound once the client code is verified against 2.x.
    "mcp[cli]>=1.0.0,<2",
    "defusedxml>=0.7.1",
    "PyJWT>=2.13.0",
    # Half the OpenAPI ecosystem serves YAML. Read with safe_load only — the
    # document comes from the host under test.
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/ptkvaibhav/clinkz"
Repository = "https://github.com/ptkvaibhav/clinkz"
Issues = "https://github.com/ptkvaibhav/clinkz/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]
# The P7 client-side execution oracle. Kept OPTIONAL on purpose: without it the
# engine behaves exactly as it did before — a DOM/CSP candidate stays an
# UnprovenExploitLead instead of silently degrading to an inferred finding. An
# absent browser must cost coverage, never honesty.
browser = [
    "playwright>=1.49.0",
]

[project.scripts]
clinkz = "clinkz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clinkz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live integration tests requiring external services (DVWA, network tools)",
    "dvwa_smoke: live DVWA skill smoke tests (require running DVWA at localhost:8080)",
    "juiceshop_smoke: live Juice Shop skill smoke tests (require running Juice Shop at localhost:3000)",
    "pipeline_smoke: real-container full-pipeline smoke tests — blocking on CI when the underlying target is up",
    "p7_browser: P7 client-side execution oracle tests requiring a real headless browser (pip install -e '.[browser]' && playwright install chromium)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["clinkz"]
