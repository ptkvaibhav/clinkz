[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinkz"
version = "0.1.0"
description = "Autonomous AI penetration testing system powered by multi-agent collaboration"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pratik Vaibhav", email = "ptkvaibhav@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.34.0",
    "google-genai>=0.5.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "mcp[cli]>=1.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/ptkvaibhav/clinkz"
Repository = "https://github.com/ptkvaibhav/clinkz"
Issues = "https://github.com/ptkvaibhav/clinkz/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
clinkz = "clinkz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clinkz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live integration tests requiring external services (DVWA, network tools)",
    "dvwa_smoke: live DVWA skill smoke tests (require running DVWA at localhost:8080)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["clinkz"]
