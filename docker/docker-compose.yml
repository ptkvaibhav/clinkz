version: "3.9"

# Clinkz Docker Compose
#
# Services:
#   tools       — Container with all security tools (nmap, nuclei, ffuf, etc.)
#   juiceshop   — OWASP Juice Shop (intentionally vulnerable web app for testing)
#   dvwa        — Damn Vulnerable Web Application
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down

services:

  # ---------------------------------------------------------------------------
  # Security tools container
  # ---------------------------------------------------------------------------
  tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tools
    image: clinkz-tools:latest
    container_name: clinkz-tools
    networks:
      - pentest-targets
    volumes:
      - ../:/workspace    # mount project root for tool execution
    environment:
      - TERM=xterm-256color
    tty: true
    stdin_open: true

  # ---------------------------------------------------------------------------
  # Test target: OWASP Juice Shop
  # ---------------------------------------------------------------------------
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: clinkz-juiceshop
    ports:
      - "3000:3000"
    networks:
      - pentest-targets
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Test target: DVWA (Damn Vulnerable Web Application)
  #
  # Uses the modern digininja/DVWA image (ships open_redirect / authbypass /
  # cryptography modules the frozen vulnerables/web-dvwa lacks). It needs an
  # external MariaDB (dvwa-db) and runs at security=low by default
  # (DEFAULT_SECURITY_LEVEL) so the full module surface is exercised.
  # ---------------------------------------------------------------------------
  dvwa:
    build:
      context: .
      dockerfile: Dockerfile.dvwa
    image: clinkz-dvwa:latest
    container_name: clinkz-dvwa
    environment:
      - DB_SERVER=dvwa-db
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
      - DEFAULT_SECURITY_LEVEL=low
    depends_on:
      dvwa-db:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - pentest-targets
    restart: unless-stopped

  dvwa-db:
    image: mariadb:10
    container_name: clinkz-dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pentest-targets
    restart: unless-stopped

networks:
  pentest-targets:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
