version: "3.9"

# Clinkz Docker Compose
#
# Services:
#   tools       — Container with all security tools (nmap, nuclei, ffuf, etc.)
#   juiceshop   — OWASP Juice Shop (intentionally vulnerable web app for testing)
#   dvwa        — Damn Vulnerable Web Application
#   meridian    — Meridian Portal (third auth shape: JSON login -> session cookie)
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down

services:

  # ---------------------------------------------------------------------------
  # Security tools container
  # ---------------------------------------------------------------------------
  tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tools
    image: clinkz-tools:latest
    container_name: clinkz-tools
    networks:
      - pentest-targets
    volumes:
      - ../:/workspace    # mount project root for tool execution
    environment:
      - TERM=xterm-256color
    tty: true
    stdin_open: true

  # ---------------------------------------------------------------------------
  # Test target: OWASP Juice Shop
  # ---------------------------------------------------------------------------
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: clinkz-juiceshop
    ports:
      - "3000:3000"
    networks:
      - pentest-targets
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Test target: DVWA (Damn Vulnerable Web Application)
  #
  # Uses the modern digininja/DVWA image (ships open_redirect / authbypass /
  # cryptography modules the frozen vulnerables/web-dvwa lacks). It needs an
  # external MariaDB (dvwa-db) and runs at security=low by default
  # (DEFAULT_SECURITY_LEVEL) so the full module surface is exercised.
  # ---------------------------------------------------------------------------
  dvwa:
    build:
      context: .
      dockerfile: Dockerfile.dvwa
    image: clinkz-dvwa:latest
    container_name: clinkz-dvwa
    environment:
      - DB_SERVER=dvwa-db
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
      # Per-run difficulty. DVWA seeds a session's `security` cookie from this on
      # first page load, so recreating the container is the whole level switch —
      # nothing in src/ ever sets it. Override per run:
      #   DVWA_SECURITY_LEVEL=high docker compose ... up -d --force-recreate dvwa
      #
      # THIS LINE IS THE ONLY THING THAT PINS `low`. The digininja image defaults
      # to `impossible`, so a container started outside compose runs the ladder's
      # honesty control group — every module patched, every confirm a phantom by
      # construction — and does it silently: the run completes and a clean report
      # reads as an engine that found nothing. Read the level back rather than
      # assuming it:
      #   docker exec clinkz-dvwa sh -c 'echo $$DEFAULT_SECURITY_LEVEL'
      - DEFAULT_SECURITY_LEVEL=${DVWA_SECURITY_LEVEL:-low}
    depends_on:
      dvwa-db:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - pentest-targets
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Protopoll - the server-side prototype-pollution target.
  #
  # Three merge endpoints and one vulnerability: /api/v2/profile merges
  # recursively and IS pollutable, /api/v2/notifications runs the same merge with
  # a three-line guard, and /api/v2/preferences uses a shallow spread that echoes
  # the injected key straight back out. The two sound ones are the two ways to be
  # wrong about this class, which is why they are here.
  #
  # The prototype write outlives the request, so a container that has been probed
  # stays polluted: `docker compose restart protopoll` between runs, exactly as a
  # real target would need its process restarted. There is no reset endpoint in
  # the image - PROTOPOLL_RESET_TOKEN is unset, so the route is 404 - and the
  # engine could not reach it anyway (it needs loopback plus a header no clinkz
  # code path sends).
  # ---------------------------------------------------------------------------
  protopoll:
    build:
      context: ./protopoll
      dockerfile: Dockerfile
    image: clinkz-protopoll:latest
    container_name: clinkz-protopoll
    ports:
      - "8095:8095"
    networks:
      - pentest-targets
    restart: unless-stopped

  dvwa-db:
    image: mariadb:10
    container_name: clinkz-dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pentest-targets
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # umami - the adaptive-auth HONESTY CONTROL.
  #
  # A real Next.js App Router application that does NOT use NextAuth. It serves
  # the same two facts cal.diy does - `X-Powered-By: Next.js` and a `Vary`
  # negotiating React Server Components - and those two are present on every
  # Next.js deployment there is. What it does NOT serve is the third: no
  # `csrfToken` field and no `<form>` at all, because its credential exchange is
  # `POST /api/auth/login` with a JSON body returning a bearer token.
  # `/api/auth/csrf`, `/api/auth/providers`, `/api/auth/session` and
  # `/api/auth/callback/credentials` all answer 404.
  #
  # The pass condition is that the adaptive layer does NOT propose a NextAuth
  # credential destination off the framework fingerprint alone. Recognising a
  # framework is not reasoning from evidence, and a confident wrong proposal
  # here is a failure rather than a coverage gap - it would repeat on every
  # client Next.js application.
  #
  # Credentials are the product's own defaults: admin / umami. The route the
  # deterministic pass finds is `/api/auth/login`, which is in _API_LOGIN_ROUTES
  # - so on a cold run the deterministic layer seats it and the adaptive layer
  # is correctly never engaged. Declaring `login_url` as the login PAGE is what
  # puts the question to the model.
  # ---------------------------------------------------------------------------
  umami:
    image: ghcr.io/umami-software/umami@sha256:fa32d116cf20cad52cbc3fad9a63b46e7fa02299d8f967168eb453d49c476b4a
    container_name: clinkz-umami
    environment:
      - DATABASE_URL=postgresql://umami:umami@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=clinkz-honesty-control
    ports:
      - "3200:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - pentest-targets
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    container_name: clinkz-umami-db
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=umami
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pentest-targets
    restart: unless-stopped

networks:
  pentest-targets:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
